# ---------------------------------------------------------------------------
#  Brick Foundry — the only file you need to run this.
#
#      docker compose up -d
#
#  On first start the container downloads the LEGO catalogue and the LDraw
#  parts library (~150 MB) by itself, then starts serving. No other commands.
# ---------------------------------------------------------------------------

services:
  app:
    build: .
    image: brick-foundry
    container_name: brick-foundry

    ports:
      # ⇩⇩⇩  CHANGE THE PORT HERE  ⇩⇩⇩
      # Left side is the port on your server (point nginx at this one).
      # Right side is inside the container — leave it as 8000.
      - "8080:8000"
      #
      # Recommended once nginx is in front: bind to localhost only, so the
      # app is reachable through your domain and not directly on the port.
      #   - "127.0.0.1:8080:8000"

    environment:
      # Downloads the data automatically on first run. Leave this on.
      AUTO_BOOTSTRAP: "true"
      # Refuse absurdly large jobs. ~6000 pieces is a big Technic set.
      MAX_PIECES_PER_JOB: "6000"
      # Parallel model conversions. Raise on a beefy server, lower on a NAS.
      MAX_CONCURRENT_DOWNLOADS: "8"
      # Delete finished ZIPs after this many seconds (24h).
      JOB_RETENTION: "86400"

    volumes:
      # Named volume: the catalogue, parts library and STL cache survive
      # rebuilds, so the 150 MB download happens exactly once. Using a named
      # volume (not a Windows path) avoids host filesystem permission issues.
      - brick-foundry-data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous: the first boot downloads and imports ~150 MB before the
      # server binds, and we must not be marked unhealthy while it works.
      start_period: 15m

volumes:
  brick-foundry-data:
