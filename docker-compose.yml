# ===========================================================================
#  Brick Foundry  -  LEGO set number  ->  printable STL files
#
#  This is the ONLY file you need. You do NOT need to clone anything:
#  Docker downloads the source from GitHub and builds it for you.
#
#      docker compose up -d
#
#  NO API KEY IS NEEDED. There is nothing to sign up for and nothing to
#  paste in. Every data source this uses is free and public.
#
#  On first start the container downloads the LEGO catalogue and the parts
#  library (~150 MB) by itself. That takes a few minutes. After that,
#  starting takes about 2 seconds.
# ===========================================================================

services:
  app:
    # Source is fetched straight from GitHub - no git clone required.
    build: https://github.com/oliverinhalo/3d-print-lego.git

    image: brick-foundry
    container_name: brick-foundry
    restart: unless-stopped

    ports:
      # ===================================================================
      #  YOUR PORT - this is the only thing most people need to change.
      #  Change the LEFT number only. Leave ":8000" exactly as it is.
      # ===================================================================
      - "${LEGO_PORT:-8100}:8000"

    environment:
      # --- These all have sensible defaults. Change only if you want to. ---

      # Download the LEGO data automatically on first start. Leave this on.
      AUTO_BOOTSTRAP: "true"

      # How many parts to convert at once. Raise it on a powerful server,
      # lower it on a small NAS or VM.
      MAX_CONCURRENT_DOWNLOADS: "8"

      # Biggest set allowed in one job, in pieces. ~6000 covers all but the
      # very largest sets.
      MAX_PIECES_PER_JOB: "6000"

      # Delete finished ZIP downloads after this many seconds (24 hours).
      JOB_RETENTION: "86400"

      # Size of printed parts. 1.0 keeps exact LDraw dimensions (a 2x4 brick
      # is 32.00 mm). Use 0.994 to match real LEGO bricks (31.80 mm).
      PART_SCALE: "1.0"

    volumes:
      # Keeps the downloaded LEGO data and the STL cache between restarts,
      # so the ~150 MB download happens only once.
      - brick-foundry-data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long, because the first start downloads ~150 MB before it serves.
      # Without this the container would be killed and restarted mid-download.
      start_period: 15m

volumes:
  brick-foundry-data:
